name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to 110
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: 43.110.141.102
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          tar -czf - --exclude .git --exclude .github . \
            | ssh "root@${HOST}" "mkdir -p /opt/nextcloud-deploy && tar -xzf - -C /opt/nextcloud-deploy"
          ssh "root@${HOST}" "bash /opt/nextcloud-deploy/deploy/apply.sh"
